<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f6fb">
  <title>远程聊天 · 同频</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1d2433;
      --muted: #8991a3;
      --line: #edf0f5;
      --accent: #6658e8;
      --accent-dark: #5143d0;
      --surface: #fff;
      --page: #f4f6fb;
      font-family: Inter, "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 12% 0%, #e9e7ff 0, transparent 34rem),
        var(--page);
      color: var(--ink);
    }

    button, input { font: inherit; }
    button { cursor: pointer; }

    .shell {
      width: min(1220px, calc(100% - 48px));
      min-height: min(790px, calc(100vh - 64px));
      margin: 32px auto;
      display: grid;
      grid-template-columns: 286px minmax(0, 1fr);
      overflow: hidden;
      border: 1px solid #e9ebf2;
      border-radius: 24px;
      background: var(--surface);
      box-shadow: 0 24px 80px #2c315014;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      padding: 26px 18px 18px;
      border-right: 1px solid var(--line);
      background: #fdfdff;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 0 9px;
      font-size: 18px;
      font-weight: 750;
      letter-spacing: -.5px;
    }

    .brand-mark {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border-radius: 13px;
      background: linear-gradient(145deg, #796cf4, #5548d9);
      color: white;
      font-size: 20px;
      box-shadow: 0 7px 16px #6558e83d;
    }

    .user-card {
      display: flex;
      align-items: center;
      gap: 11px;
      margin: 28px 0 24px;
      padding: 12px;
      border: 1px solid #f0f1f7;
      border-radius: 16px;
      background: white;
    }

    .avatar {
      display: grid;
      flex: 0 0 auto;
      width: 40px;
      height: 40px;
      place-items: center;
      border-radius: 14px;
      background: #e8e5ff;
      color: #594bd4;
      font-size: 15px;
      font-weight: 700;
    }

    .avatar.mint { background: #dff5ed; color: #288565; }
    .avatar.peach { background: #ffeadc; color: #bc7044; }
    .avatar.blue { background: #e1edff; color: #4777bd; }
    .avatar.pink { background: #fde5ef; color: #ba6286; }
    .user-meta { min-width: 0; }
    .user-name { font-size: 13px; font-weight: 700; }
    .user-status { margin-top: 4px; color: var(--muted); font-size: 11px; }
    .online-dot {
      width: 8px;
      height: 8px;
      margin-left: auto;
      border-radius: 50%;
      background: #50c99a;
      box-shadow: 0 0 0 3px #e5f8f0;
    }

    .section-label {
      padding: 0 10px;
      color: #a0a6b4;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.3px;
      text-transform: uppercase;
    }

    .contact-list { display: grid; gap: 5px; margin-top: 10px; }
    .contact {
      display: flex;
      align-items: center;
      gap: 11px;
      width: 100%;
      padding: 11px 10px;
      border: 0;
      border-radius: 14px;
      background: transparent;
      color: inherit;
      text-align: left;
    }

    .contact.active { background: #f0efff; }
    .contact:hover:not(.active) { background: #f6f7fb; }
    .contact .avatar { width: 38px; height: 38px; border-radius: 13px; }
    .contact-detail { min-width: 0; flex: 1; }
    .contact-name { font-size: 12px; font-weight: 700; }
    .contact-preview {
      overflow: hidden;
      margin-top: 5px;
      color: var(--muted);
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .sidebar-bottom {
      margin-top: auto;
      padding: 14px 10px 4px;
      color: #9ba2b1;
      font-size: 11px;
      line-height: 1.7;
    }

    .main { display: flex; min-width: 0; flex-direction: column; }
    .chat-header {
      display: flex;
      min-height: 82px;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 28px;
      border-bottom: 1px solid var(--line);
    }

    .chat-title { font-size: 16px; font-weight: 750; }
    .chat-subtitle { margin-top: 5px; color: var(--muted); font-size: 11px; }
    .demo-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 11px;
      border: 1px solid #f3e4c8;
      border-radius: 999px;
      background: #fff9ed;
      color: #a26b19;
      font-size: 10px;
      font-weight: 700;
      white-space: nowrap;
    }
    .demo-badge::before {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #e7a634;
      content: "";
    }

    .notice {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 18px 26px 0;
      padding: 12px 14px;
      border: 1px solid #e8e6ff;
      border-radius: 13px;
      background: #f8f7ff;
      color: #625a9d;
      font-size: 11px;
      line-height: 1.65;
    }
    .notice-icon { font-size: 15px; }

    .messages {
      display: flex;
      flex: 1;
      flex-direction: column;
      gap: 18px;
      overflow-y: auto;
      padding: 24px 28px;
    }

    .day-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #a2a8b5;
      font-size: 10px;
    }
    .day-divider::before, .day-divider::after {
      height: 1px;
      flex: 1;
      background: var(--line);
      content: "";
    }

    .message-row { display: flex; align-items: flex-end; gap: 9px; }
    .message-row.mine { justify-content: flex-end; }
    .message-row .avatar { width: 30px; height: 30px; border-radius: 11px; font-size: 11px; }
    .message-content { max-width: min(72%, 440px); }
    .message-author { margin: 0 0 6px 3px; color: #858da0; font-size: 10px; }
    .bubble {
      padding: 11px 14px;
      border: 1px solid #edf0f5;
      border-radius: 5px 16px 16px;
      background: #f6f7fb;
      color: #343b4c;
      font-size: 12px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }
    .mine .bubble {
      border-color: transparent;
      border-radius: 16px 5px 16px 16px;
      background: var(--accent);
      color: white;
    }
    .message-time { margin: 5px 3px 0; color: #a2a8b5; font-size: 9px; }
    .mine .message-time { text-align: right; }

    .composer-wrap { padding: 0 26px 22px; }
    .composer {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px 9px 16px;
      border: 1px solid #e9ebf2;
      border-radius: 17px;
      background: #fff;
      box-shadow: 0 5px 20px #2c315009;
    }
    .composer:focus-within { border-color: #b9b2fa; box-shadow: 0 0 0 3px #6658e814; }
    .composer input {
      min-width: 0;
      flex: 1;
      padding: 8px 0;
      border: 0;
      outline: 0;
      color: var(--ink);
      font-size: 12px;
    }
    .composer input::placeholder { color: #a5abba; }
    .send-button {
      display: grid;
      width: 39px;
      height: 39px;
      place-items: center;
      border: 0;
      border-radius: 13px;
      background: var(--accent);
      color: white;
      transition: background .15s, transform .15s;
    }
    .send-button:hover { transform: translateY(-1px); background: var(--accent-dark); }
    .send-button svg { width: 17px; height: 17px; }
    .composer-hint { margin: 8px 4px 0; color: #a1a7b4; font-size: 9px; }

    .resources {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 0 26px 22px;
    }
    .resource {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 14px;
      color: inherit;
      text-decoration: none;
      transition: border-color .15s, transform .15s;
    }
    .resource:hover { transform: translateY(-1px); border-color: #c9c4fb; }
    .resource-icon {
      display: grid;
      flex: 0 0 auto;
      width: 34px;
      height: 34px;
      place-items: center;
      border-radius: 11px;
      background: #f0efff;
      color: #5e51db;
      font-size: 15px;
    }
    .resource-copy { min-width: 0; }
    .resource-title { font-size: 11px; font-weight: 700; }
    .resource-description {
      overflow: hidden;
      margin-top: 4px;
      color: var(--muted);
      font-size: 9px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .resource-arrow { margin-left: auto; color: #9da3b0; font-size: 15px; }

    @media (max-width: 760px) {
      .shell {
        width: 100%;
        min-height: 100vh;
        margin: 0;
        grid-template-columns: 72px minmax(0, 1fr);
        border: 0;
        border-radius: 0;
      }
      .sidebar { align-items: center; padding: 18px 8px; }
      .brand { padding: 0; }
      .brand-name, .user-card .user-meta, .user-card .online-dot,
      .section-label, .contact-detail, .sidebar-bottom { display: none; }
      .user-card { margin: 24px 0 18px; padding: 0; border: 0; background: none; }
      .contact-list { gap: 8px; }
      .contact { justify-content: center; padding: 7px; }
      .contact .avatar { width: 42px; height: 42px; }
      .chat-header { min-height: 72px; padding: 14px 17px; }
      .notice { margin: 14px 14px 0; }
      .messages { padding: 20px 15px; }
      .composer-wrap { padding: 0 14px 15px; }
      .resources { grid-template-columns: 1fr; margin: 0 14px 15px; }
    }

    @media (max-width: 420px) {
      .demo-badge { padding: 7px 8px; font-size: 9px; }
      .message-content { max-width: 82%; }
      .resource-description { white-space: normal; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <aside class="sidebar" aria-label="聊天联系人">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">⌁</span>
        <span class="brand-name">同频</span>
      </div>

      <div class="user-card">
        <div class="avatar">我</div>
        <div class="user-meta">
          <div class="user-name">我的空间</div>
          <div class="user-status">本地预览模式</div>
        </div>
        <span class="online-dot" aria-hidden="true"></span>
      </div>

      <div class="section-label">最近聊天</div>
      <div class="contact-list">
        <button class="contact active" type="button" aria-current="true">
          <span class="avatar mint">林</span>
          <span class="contact-detail">
            <span class="contact-name">林间晚风</span>
            <span class="contact-preview">等我们连上服务器再聊～</span>
          </span>
        </button>
        <button class="contact" type="button">
          <span class="avatar peach">小</span>
          <span class="contact-detail">
            <span class="contact-name">小岛同学</span>
            <span class="contact-preview">分享一段好听的音乐</span>
          </span>
        </button>
        <button class="contact" type="button">
          <span class="avatar blue">阿</span>
          <span class="contact-detail">
            <span class="contact-name">阿北</span>
            <span class="contact-preview">周末一起开黑吗？</span>
          </span>
        </button>
        <button class="contact" type="button">
          <span class="avatar pink">M</span>
          <span class="contact-detail">
            <span class="contact-name">Momo</span>
            <span class="contact-preview">晚安，明天见</span>
          </span>
        </button>
      </div>

      <div class="sidebar-bottom">简单、轻松地<br>和远方的人保持联系。</div>
    </aside>

    <section class="main" aria-label="聊天窗口">
      <header class="chat-header">
        <div>
          <div class="chat-title">林间晚风</div>
          <div class="chat-subtitle">一对一聊天 · 演示会话</div>
        </div>
        <span class="demo-badge">尚未连接实时服务</span>
      </header>

      <div class="notice" role="status">
        <span class="notice-icon" aria-hidden="true">ⓘ</span>
        <span>这是可交互的本地预览：你发送的消息只显示在当前页面，不会传到另一台设备。接入云端实时服务后，即使家里没有公网 IP，也能异地聊天。</span>
      </div>

      <div class="messages" id="messages" aria-live="polite" aria-label="消息记录">
        <div class="day-divider">今天</div>
        <div class="message-row">
          <span class="avatar mint" aria-hidden="true">林</span>
          <div class="message-content">
            <div class="message-author">林间晚风</div>
            <div class="bubble">嗨！这是聊天窗口的预览。等我们连上服务器再聊～</div>
            <div class="message-time">10:24</div>
          </div>
        </div>
        <div class="message-row mine">
          <div class="message-content">
            <div class="bubble">收到！页面看起来不错 👋</div>
            <div class="message-time">10:25</div>
          </div>
          <span class="avatar" aria-hidden="true">我</span>
        </div>
      </div>

      <div class="composer-wrap">
        <form class="composer" id="chat-form">
          <input id="message-input" type="text" maxlength="500" autocomplete="off" placeholder="输入一条消息…（仅页面预览）" aria-label="输入消息">
          <button class="send-button" type="submit" aria-label="发送消息">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M21 3 10.8 13.2M21 3l-6.5 18-3.7-7.8L3 9.5 21 3Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </form>
        <div class="composer-hint">Enter 发送 · 演示消息只显示在当前页面</div>
      </div>

      <div class="resources" aria-label="相关工具">
        <a class="resource" href="https://www.radmin-vpn.com/" target="_blank" rel="noopener noreferrer">
          <span class="resource-icon" aria-hidden="true">⌘</span>
          <span class="resource-copy">
            <span class="resource-title">Radmin VPN ↗</span>
            <span class="resource-description">虚拟局域网，适合远程联机</span>
          </span>
          <span class="resource-arrow" aria-hidden="true">›</span>
        </a>
        <a class="resource" href="https://one.one.one.one/" target="_blank" rel="noopener noreferrer">
          <span class="resource-icon" aria-hidden="true">◉</span>
          <span class="resource-copy">
            <span class="resource-title">Cloudflare WARP ↗</span>
            <span class="resource-description">网络连接与隐私保护工具</span>
          </span>
          <span class="resource-arrow" aria-hidden="true">›</span>
        </a>
      </div>
    </section>
  </main>

  <script>
    const form = document.querySelector("#chat-form");
    const input = document.querySelector("#message-input");
    const messages = document.querySelector("#messages");
    function addMessage(text, time) {
      const row = document.createElement("div");
      row.className = "message-row mine";

      const content = document.createElement("div");
      content.className = "message-content";
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;
      const timestamp = document.createElement("div");
      timestamp.className = "message-time";
      timestamp.textContent = time;
      content.append(bubble, timestamp);

      const avatar = document.createElement("span");
      avatar.className = "avatar";
      avatar.setAttribute("aria-hidden", "true");
      avatar.textContent = "我";
      row.append(content, avatar);
      messages.append(row);
      messages.scrollTop = messages.scrollHeight;
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      const time = new Intl.DateTimeFormat("zh-CN", {
        hour: "2-digit",
        minute: "2-digit"
      }).format(new Date());
      addMessage(text, time);
      input.value = "";
      input.focus();
    });
  </script>
</body>
</html>
